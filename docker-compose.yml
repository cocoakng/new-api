# New-API Docker Compose Configuration
#
# Quick Start:
#   1. cp .env.example .env  (edit with your values)
#   2. docker compose up -d
#   3. Access at http://localhost:3000
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

services:
  new-api:
    image: cocoakng/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: root:${DB_PASSWORD}@tcp(mysql:3306)/new-api
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: new-api-node-1
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      - redis
      - mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --log-output=TABLE,FILE --slow-query-log=ON --long-query-time=2 --log-error=/var/log/mysql/error.log --slow-query-log-file=/var/log/mysql/slow.log
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: new-api
    volumes:
      - mysql_data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
